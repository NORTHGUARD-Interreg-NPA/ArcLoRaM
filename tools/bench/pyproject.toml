[project]
name = "bench"
version = "0.1.0"
description = "Build, flash and test the ArcLoRaM firmware on the bench boards without a human in the loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arclog",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not scale'"
markers = ["scale: a record of days (10 nodes over 72 h), about a minute; `pytest -m scale`"]

[tool.uv.sources]
arclog = { path = "../arclog", editable = true }

[tool.uv]
# Rebuild when the sources change, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
