# Purpose: acceptance. Issue #101, Test Record docs/test-tracker/101-core-stall.md.
# Claim: BOOT carries the reset cause on both cores, and it is the cause: after a bench reset. The OpenOCD of a Pi Node
# resets through the NRST pin (GPIO18), so the reset action must read pin on both cores (two BOOT lines).
# Only the lines after arming count, so the boot that follows the flash is not among them: its cause is in the record
# (on a board that ran older firmware it is stale, see the Test Record). The power cycle and the hand pin reset are
# done by hand, see the Test Record.
description = "BOOT names the reset cause on both cores"
timeout = "6m"

[nodes]
6 = "C2"

[[action]]
reset = 6
at = "+90s"

[[expect]]
node = 6
event = "BOOT"
where = { rst = "pin" }
count = 2
within = "5m"

[[forbid]]
node = 6
event = "CORE_CRASH"
