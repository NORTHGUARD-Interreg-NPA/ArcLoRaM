# Purpose: acceptance. Issue #101, Test Record docs/test-tracker/101-core-stall.md.
# Claim: a data bus error on the CM4 is reported with the address it read, from BFAR.
# Same as core-stall-crash-cm4.toml with BENCH_FAULT_CM4=3: a read of 0x60000000 (PRECISERR, BFARVALID).
description = "A forced data bus error on the CM4 is reported with its address"
timeout = "8m"

[nodes]
1 = "C3"
6 = "C2"

[overrides]
BENCH_FAULT_CM4 = "3"
BENCH_FAULT_NODE = "6"
BENCH_FAULT_AFTER_S = "60"

[[action]]
reset = 6
at = "+4m"

[[expect]]
node = 6
event = "CORE_CRASH"
where = { core = "cm4", kind = "bus", why = "preciserr" }
within = "6m"

[[expect]]
node = 6
event = "CORE_CRASH_SCB"
where = { core = "cm4", cfsr = "00008200", bfar = "60000000" }
within = "6m"

[[forbid]]
node = 1
event = "CORE_CRASH"
