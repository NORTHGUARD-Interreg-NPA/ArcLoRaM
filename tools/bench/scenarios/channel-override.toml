# Purpose: acceptance. Issue #85, Test Record docs/test-tracker/85-channel-override.md.
# Claim: a run on its own channel puts its Sync on that channel and none on the default one. The Build
# Override FREQ_DEFAULT_HZ=867300000u (channel_plan.h) moves every phase's channel; a lone C3 sends its
# cell 0 at boot, so the first Sync must read freq=867300000 and no Sync may read freq=868300000. Another
# session may work on 868.3 MHz meanwhile (1 MHz away is clear): the run takes the channel lease and says
# nothing of air conflicts. A template: node 0 is the board under test, aimed with `--as <Node ID>`.
description = "A run on 867.3 MHz sends its Sync on 867.3 MHz and none on 868.3 MHz"
timeout = "4m"

[nodes]
0 = "C3"

[overrides]
FREQ_DEFAULT_HZ = "867300000u"
SYNC_BOOT_BURST = "5u"      # cell 0 leaves before the run is armed; cells 1 to 4 follow, 20 s apart

[[expect]]
node = 0
event = "SYNC_TX"
where = { freq = 867300000 }
within = "2m"

[[expect]]
node = 0
event = "TX_DONE"
within = "2m"

[[forbid]]
node = 0
event = "SYNC_TX"
where = { freq = 868300000 }

[[forbid]]
event = "TX_DENIED"
