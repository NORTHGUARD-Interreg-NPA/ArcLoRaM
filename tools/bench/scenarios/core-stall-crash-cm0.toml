# Purpose: acceptance. Issue #101, Test Record docs/test-tracker/101-core-stall.md.
# Claim: a fault on the CM0+ leaves a crash record that the next BOOT reports. The CM0+ (a Cortex-M0+) has no fault status
# registers: its record is the stacked frame, and the report says why=na.
# Node 6 (a C2) has its CM0+ jump to an address with no memory from its main loop (BENCH_FAULT_CM0=1), 60 s after its boot;
# the CM0+ stops in its HardFault handler while the CM4 keeps running. Bench resets the node at +4 min and the next BOOT
# must print CORE_CRASH for the CM0+.
description = "A forced bus error on the CM0+ is reported at the next BOOT"
timeout = "8m"

[nodes]
1 = "C3"
6 = "C2"

[overrides]
BENCH_FAULT_CM0 = "1"
BENCH_FAULT_NODE = "6"
BENCH_FAULT_AFTER_S = "60"

[[action]]
reset = 6
at = "+4m"

[[expect]]
node = 6
event = "CORE_CRASH"
where = { core = "cm0", kind = "hard", why = "na", pc = "60000000" }
within = "6m"

[[forbid]]
node = 1
event = "CORE_CRASH"

[[forbid]]
node = 6
event = "CORE_CRASH_SCB"
