# Purpose: acceptance. Issue #36, Test Record docs/test-tracker/36-guard-from-drift.md.
# C3 (Node 5) + C2 (Node 2), NUCLEO Clock, nothing injected, the DEV profile (a Sync
# phase every 200 s, one packet per node per phase) with the boot burst of 5 so
# that a cold C2 locks in about a minute (ADR-0020). The Rx guard follows the
# drift estimate (ADR-0022): the cap (100 ms) until the estimate is valid, about
# 33 min of packets, then about 10 ms on this pair (3 x the 1.6 ms of D(t), plus
# the 5 ms of measured Rx start latency).
# Every Sync packet the C3 sent is to be received or lost for a radio reason,
# never because the C2's window was not open on it; that accounting, the
# guard distribution (RX_WIN g) and the empty-window Rx time are read from the
# run record (docs/test-tracker/36-guard-from-drift.md). The scenario stages its
# expectations so that a bad run ends within the first hour, and holds the
# duration with a count of locked packets (one per 200 s: 6 h is about 108),
# staged every 10 packets (about 33 min) so that a silent node, which nothing
# else in a scenario sees until #86, ends the run within one stage: the run of
# 2026-10-05 held the boards 2 h 14 min after the C2 stopped (node-silences.md).
# The deadlines are the measured pacing of that run, 4 % and 8 min of slack.
# The Rx start latency (GUARD_RX_START_LATENCY_US) was measured before this run
# (the Test Record).
description = "Guard from the drift estimate: 6 h of a locked NUCLEO pair, no mistiming loss"
timeout = "370m"

[nodes]
5 = "C3"
2 = "C2"

[overrides]
SYNC_BOOT_BURST = "5u"

[[expect]]
node = 5
event = "SYNC_TX"

[[expect]]
node = 2
event = "CLK"
where = { to = "WARM" }
within = "4m"

[[expect]]
node = 2
event = "DRIFT"
where = { ok = 1 }
within = "50m"

[[expect]]
node = 2
event = "RX_WIN"
where = { g = { min = 8, max = 15 } }
within = "55m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 10
within = "40m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 20
within = "75m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 30
within = "109m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 40
within = "144m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 50
within = "179m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 60
within = "213m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 70
within = "248m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 80
within = "283m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 90
within = "317m"

[[expect]]
node = 2
event = "SYNC_RX"
where = { act = "t1" }
count = 100
within = "352m"

[[forbid]]
event = "TX_DENIED"

[[forbid]]
event = "TX_LATE"

[[forbid]]
event = "RX_LATE"

[[forbid]]
event = "SYNC_SILENCE"

[[forbid]]
event = "SLOT_SUSPECT"

[[forbid]]
event = "SYNC_RX"
where = { act = "t3" }

[[forbid]]
event = "CLK"
where = { to = "COLD" }
